<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realty ONE CRM Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="panel-header">
      <div class="brand">
        <span class="lion-icon">🦁</span>
        <div class="brand-text">
          <span class="brand-title">Realty ONE CRM</span>
          <span class="brand-sub">Bolivia • WhatsApp Sync</span>
        </div>
      </div>
      <div class="header-actions">
        <span id="sync-indicator" class="sync-badge syncing" title="Estado de conexión">Conectando...</span>
        <button id="btn-refresh" class="icon-btn" title="Recargar prospectos">🔄</button>
        <button id="btn-open-full" class="icon-btn" title="Abrir CRM completo en nueva pestaña">↗</button>
      </div>
    </header>

    <!-- Active Chat Banner -->
    <section class="active-chat-card" id="active-chat-card">
      <div class="card-header">
        <span class="badge-tag">CHAT ACTIVO</span>
        <span id="active-contact-time" class="time-label"></span>
      </div>
      <div class="active-contact-info">
        <h2 id="active-contact-name">Selecciona un chat en WhatsApp</h2>
        <span id="active-contact-phone" class="phone-label"></span>
      </div>

      <!-- Quick Lead Form -->
      <div id="active-lead-controls" class="lead-controls hidden">
        <div class="control-row">
          <div class="control-group">
            <label for="lead-stage">Etapa Embudo</label>
            <select id="lead-stage">
              <option value="SOLICITUD">✨ Solicitud / Nuevo</option>
              <option value="CONTACTADO">📞 Contactado</option>
              <option value="VISITA_AGENDADA">📅 Visita Agendada</option>
              <option value="PROPUESTA">📝 Propuesta / Negociación</option>
              <option value="CIERRE">🏆 Cerrado / Ganado</option>
              <option value="PERDIDO">❌ Descartado</option>
            </select>
          </div>
          <div class="control-group">
            <label for="lead-priority">Prioridad</label>
            <select id="lead-priority">
              <option value="POTENCIAL">🔥 Potencial (Alta)</option>
              <option value="INDECISO">⚡ Indeciso (Media)</option>
              <option value="PASIVO">❄️ Pasivo (Baja)</option>
              <option value="PROPIETARIO">💼 Propietario (Captación)</option>
            </select>
          </div>
        </div>

        <div class="control-row">
          <div class="control-group full-width">
            <label for="lead-realtor">e-Realtor Asignado</label>
            <select id="lead-realtor">
              <option value="">Sin Asignar</option>
              <option value="carlos_rodriguez">Carlos Rodríguez (Venta de Lujo & Casas)</option>
              <option value="valeria_suarez">Valeria Suárez (Alquileres & Deptos)</option>
              <option value="andres_montano">Andrés Montaño (Terrenos & Parque Ind.)</option>
              <option value="lucia_vaca">Lucía Vaca (Anticréticos & Asesoría Legal)</option>
              <option value="robert_oliva">Robert Oliva (Master Broker / Inversión VIP)</option>
            </select>
          </div>
        </div>

        <div class="note-box">
          <input type="text" id="quick-note-input" placeholder="Guardar nota o registrar prospecto..." />
          <button id="btn-save-note" class="gold-btn">Guardar</button>
        </div>

        <!-- Quick Response Templates -->
        <div class="templates-section">
          <span class="section-title">Respuestas Rápidas (Copiar al portapapeles):</span>
          <div class="template-chips">
            <button class="chip-btn" data-template="bienvenida">👋 Bienvenida</button>
            <button class="chip-btn" data-template="mar_adentro">🌊 Mar Adentro</button>
            <button class="chip-btn" data-template="agendar">📅 Agendar Visita</button>
            <button class="chip-btn" data-template="requisitos">📋 Requisitos</button>
          </div>
        </div>
      </div>

      <div id="no-contact-msg" class="no-contact-msg">
        Abre una conversación en WhatsApp Web para ver o registrar el lead automáticamente aquí.
      </div>
    </section>

    <!-- Pipeline Tabs & Search -->
    <section class="pipeline-section">
      <div class="search-bar">
        <input type="text" id="leads-search" placeholder="🔍 Buscar por nombre, celular o zona..." />
      </div>

      <div class="filter-pills">
        <button class="pill active" data-filter="TODAS">Todos (<span id="count-all">0</span>)</button>
        <button class="pill" data-filter="POTENCIAL">🔥 Potencial (<span id="count-potencial">0</span>)</button>
        <button class="pill" data-filter="VISITA_AGENDADA">📅 Visitas</button>
        <button class="pill" data-filter="INDECISO">⚡ Seguimiento</button>
        <button class="pill" data-filter="PROPIETARIO">💼 Captaciones</button>
      </div>

      <!-- Leads List -->
      <div id="leads-list" class="leads-list">
        <div class="loading-state">
          <div class="spinner"></div>
          <span>Cargando prospectos de Realty ONE...</span>
        </div>
      </div>
    </section>
  </div>

  <script src="panel.js"></script>
</body>
</html>
