<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro CRM - Realty ONE Group Bolivia</title>
  <link rel="icon" type="image/svg+xml" href="/logo_one_circle.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0a0e11;
      --card-bg: #111b21;
      --card-inner: #1a252d;
      --gold-primary: #CAA65E;
      --gold-hover: #dfbc73;
      --gold-glow: rgba(202, 166, 94, 0.25);
      --text-white: #f0f2f5;
      --text-muted: #8696a0;
      --border-color: #222d34;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(202, 166, 94, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(202, 166, 94, 0.05) 0%, transparent 40%);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--gold-glow);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      background: var(--card-inner);
      border: 2px solid var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .brand-logo-wrap img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-white);
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 42px 12px 40px;
      color: var(--text-white);
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .form-input:focus + .input-icon {
      color: var(--gold-primary);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .toggle-pass:hover {
      color: var(--gold-primary);
    }

    .alert-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--gold-primary), #b38e45);
      color: #0c1317;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(202, 166, 94, 0.3);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--gold-hover), var(--gold-primary));
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(202, 166, 94, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .footer-note i {
      color: var(--gold-primary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo-wrap">
        <img src="/logo_one_circle.png" alt="Realty ONE Group">
      </div>
      <h1 class="brand-title">Realty ONE Group</h1>
      <p class="brand-subtitle">Panel de Control & CRM Leads 24/7</p>
    </div>

    <div id="errorAlert" class="alert-box">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errorMsg">Credenciales incorrectas.</span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">Usuario Administrador</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="form-input" placeholder="admin" required autofocus autocomplete="username">
          <i class="fa-solid fa-user input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña Maestra</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <i class="fa-solid fa-lock input-icon"></i>
          <i class="fa-regular fa-eye toggle-pass" id="togglePassBtn" onclick="togglePasswordVisibility()"></i>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">Ingresar al Sistema</span>
        <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
      </button>
    </form>

    <div class="footer-note">
      <i class="fa-solid fa-shield-halved"></i> Conexión Segura SSL/TLS Encriptada
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassBtn');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleBtn.classList.remove('fa-eye');
        toggleBtn.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        toggleBtn.classList.remove('fa-eye-slash');
        toggleBtn.classList.add('fa-eye');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const errorAlert = document.getElementById('errorAlert');
      const errorMsg = document.getElementById('errorMsg');

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      btnText.innerText = 'Verificando...';
      btnIcon.className = 'fa-solid fa-circle-notch fa-spin';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          btnText.innerText = '¡Acceso Concedido!';
          btnIcon.className = 'fa-solid fa-check';
          submitBtn.style.background = '#10b981';

          // Guardar token en localStorage como respaldo
          if (data.token) {
            localStorage.setItem('rog_auth_token', data.token);
          }

          // Redireccionar al destino solicitado o a ingreso_leads
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/ingreso_leads.html';
          setTimeout(() => {
            window.location.href = redirect;
          }, 400);
        } else {
          throw new Error(data.error || 'Usuario o contraseña incorrectos.');
        }
      } catch (err) {
        errorMsg.innerText = err.message;
        errorAlert.style.display = 'flex';
        submitBtn.disabled = false;
        btnText.innerText = 'Ingresar al Sistema';
        btnIcon.className = 'fa-solid fa-arrow-right';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    // Si ya existe sesión activa, redirigir automáticamente
    (async function checkExistingSession() {
      try {
        const res = await fetch('/api/auth/check');
        if (res.ok) {
          const d = await res.json();
          if (d.authenticated) {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || '/ingreso_leads.html';
            window.location.href = redirect;
          }
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
