services:
  - type: web
    name: realty-one-whatsapp-bot
    env: node
    plan: free
    region: oregon
    buildCommand: npm install; cd backend; npm install; cd ..
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/La_Paz
      - key: ADMIN_KEY
        value: ONE2026
      - key: QR_USER
        value: admin
      - key: QR_PASS
        value: ONE2026
      # ── Secretos: configurar en Render Dashboard → Environment ──
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
